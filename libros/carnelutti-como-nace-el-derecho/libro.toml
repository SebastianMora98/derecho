# Resumen general. Prosa a mano, párrafos separados por una línea en blanco,
# markdown inline permitido.
resumen = """
Son **diez conversaciones dictadas**, no un tratado, y estaban pensadas para
gente que no estudia derecho: de ahí que todo se explique con ejemplos
cotidianos, empezando por el de alguien que frente a una frutería duda entre
robar una manzana y comprarla. La pregunta que las ordena es cómo el derecho
llega a existir, y la respuesta es tajante: el derecho es un **sustituto de la
moral**, algo inventado para conseguir por la fuerza el orden que el amor al
prójimo no alcanza a dar.

El camino hasta ahí empieza en la **economía**. Las necesidades son ilimitadas y
los bienes limitados, así que cada uno retiene lo que tomó, y eso es el
**dominio**. Invadir el dominio ajeno es la **guerra**, y no solo entre
pueblos, porque el hurto tiene la misma esencia. La guerra es desorden, en un
mundo donde los hombres no pueden vivir en el caos. El contrato económico apenas
consigue una **tregua**, porque el más fuerte lo rompe cuando le conviene. La
**moral** sí sería la solución, pero llegar a ella lleva una vida entera y la
necesidad de terminar la guerra es inmediata. Entonces manda un **jefe**, y su
mandato tiene dos piezas: el **precepto** y la **sanción**.

Con esa cadena armada, el resto del libro la recorre hacia adelante: la guerra
pasa a llamarse **delito**, la propiedad y el contrato dejan de ser económicos
para volverse jurídicos, los mandatos generales e hipotéticos son las **leyes**,
un producto a medio terminar que el **juicio** completa y que según él es
históricamente anterior a la ley. La sociedad ordenada se llama **Estado**, que
deriva del derecho y no al revés. Cierra con dos advertencias: el derecho
internacional todavía no es derecho sino un feto, y ni la técnica ni la ciencia
alcanzan para hacer justicia, porque cada hombre es en verdad una excepción y
para eso está la **equidad**.
"""
