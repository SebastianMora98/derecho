resumen_corto = """
Toda ciencia tiene un objeto de estudio propio; el derecho arrastra tres
respuestas rivales sobre el suyo: la **norma jurídica** —la de Kelsen—, la
justicia, o la vida humana y las relaciones entre personas. Cada una toma una
parte y la hace pasar por el todo. La norma, por ejemplo, es pura forma vacía
de contenido: alcanza como objeto de la lógica jurídica, no de toda la
disciplina.

La respuesta de Fernández Sessarego es que el objeto es la interacción de los
tres: **vida humana, valores y normas**. Ninguno es derecho por sí solo y
ninguno puede faltar. Eso es la **teoría tridimensional del derecho**.
"""

