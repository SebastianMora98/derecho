# sin distinciones, sin test y sin flashcards, a pedido. Prosa a mano, párrafos
# separados por una línea en blanco, markdown inline permitido.
resumen = """
El propio Fernández Sessarego cuenta, en diez minutos, **de dónde salió la
teoría tridimensional del derecho**: es la misma tesis de *Derecho y persona*,
pero contada como historia personal y no como argumento. Sirve para entrar al
tema antes de leer el capítulo, o para fijarlo después.

Arranca con una escena de 1945, cuando él tenía 19 años y cursaba el primer
semestre. En la primera clase de introducción al derecho, un profesor conocido
afirmó que el objeto de estudio del derecho era **la norma jurídica**, siguiendo
a Kelsen, cuya teoría pura dominaba entonces la enseñanza. Pero agregó algo que
lo desconcertó: que había otro sector para el cual ese objeto era **la
justicia**, y un tercero para el cual eran **la vida humana y las relaciones
entre personas**. Tres respuestas distintas a la misma pregunta, en una
disciplina donde toda otra ciencia tiene un solo objeto.

El desconcierto tenía una razón concreta: antes de derecho había estudiado
filosofía, lógica, axiología y psicología, y por la lógica sabía que la norma
es **pura forma, vacía de contenido** — de modo que no podía ser el objeto de
estudio de toda la disciplina, sino a lo sumo el de la lógica jurídica. Cuenta
también el clima de época que lo empujó hacia la filosofía de la existencia:
la posguerra, y una tecnología que avanzaba más rápido de lo que el derecho
podía regularla.

La salida le llevó años, y la explica con analogías cotidianas: un motor,
donde ninguna pieza es el motor pero si se saca una el motor se detiene; y un
pisco sour, donde ni el pisco, ni el limón, ni el azúcar son la bebida, pero
ninguno puede faltar. La conclusión, que fue su tesis de bachiller en 1950, es
que el objeto de estudio del derecho es **la interacción de vida humana,
valores y normas**: ninguno de los tres es derecho por sí solo, y ninguno puede
faltar. De ahí sale lo que hoy se llama teoría tridimensional del derecho.
"""
