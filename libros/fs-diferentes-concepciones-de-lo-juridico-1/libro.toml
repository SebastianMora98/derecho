# Ficha del libro. Editá estos valores: alimentan la sección
# CONFIGURACIÓN de los prompts generados por `ema.py preparar`.

titulo = "Derecho y persona"
autor = "Carlos Fernández Sessarego"
# Lo publicado es un capítulo de una obra mayor: este es el piso de arriba de la
# jerarquía, el que agrupa a los apartados. Un libro de jerarquía plana (como
# Beccaria) no lleva esta clave y el sitio no muestra ese nivel.
contenedor = "Capítulo V — Diferentes concepciones de lo jurídico"
edicion = "5ª ed. actualizada y ampliada, Astrea, Buenos Aires - Bogotá, 2015. Prólogo de Ricardo D. Rabinovich-Berkman"
fuente = "FS-Diferentes concepciones de lo juridico-1.pdf"

# principiante / intermedio / avanzado
nivel = "principiante"
# examen / investigacion / cultura-general / aplicacion-practica
proposito = "examen"
tiempo = "90 minutos"
# paginas / capitulos / subtitulos / parrafos — ver la nota en prompts/estudio.md
formato_citas = "paginas"

# Variantes de la plantilla a activar. Ver prompts/variantes.md
# Opciones: examen, investigacion, tecnico, narrativo
variantes = ["examen"]

# Plantilla base a usar en `preparar` (archivo dentro de prompts/)
plantilla = "estudio.md"

# Apartados del capítulo: el piso intermedio entre el capítulo y el parágrafo.
# `desde`/`hasta` son números de sección; el índice del sitio agrupa por acá.
# Lo imprime `ema.py dividir` listo para pegar. Un libro de jerarquía plana
# (como Beccaria) simplemente no lleva esta tabla.
[[partes]]
titulo = "A) Visiones unidimensionales del derecho"
desde = 1
hasta = 6

[[partes]]
titulo = "B) La concepción tridimensional de lo jurídico"
desde = 7
hasta = 10

[[partes]]
titulo = "C) Personalismo, tridimensionalismo y otros aportes del código civil peruano de 1984 a la codificación civil comparada"
desde = 11
hasta = 19
