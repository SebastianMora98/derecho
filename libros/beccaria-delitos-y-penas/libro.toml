# Ficha del libro. Editá estos valores: alimentan la sección
# CONFIGURACIÓN de los prompts generados por `ema.py preparar`.

titulo = "Tratado de los delitos y de las penas"
autor = "Cesare Beccaria"
# Sección del índice. Se declara en libros/grupos.toml.
grupo = "Clase A"
edicion = "Universidad Carlos III de Madrid, 2015 (Historia del derecho, 32)"
fuente = "content.pdf"

# Original de 1764. Esta edición se distribuye bajo
# Creative Commons Atribución-NoComercial-SinDerivadas 3.0 España.
anio = 1764
licencia = "CC BY-NC-ND 3.0 ES"

# principiante / intermedio / avanzado
nivel = "intermedio"
# examen / investigacion / cultura-general / aplicacion-practica
proposito = "examen"
tiempo = "90 minutos"
# paginas / capitulos / subtitulos / parrafos — ver la nota en
# prompts/estudio.md para cuál corresponde según cómo esté marcado el texto.
# Beccaria numera sus 47 capítulos, así que se cita por capítulo: la edición
# no preservó la paginación del original.
formato_citas = "capitulos"

# Encabezados que la conversión dejó como `##` pero no son capítulos de
# Beccaria: portadilla, ISBN, el índice y el catálogo de la editorial.
# «8. Nota sobre la presente edición» es la nota del editor de 2015 —el «8.»
# es un número de página que arrastró el índice—: explica de qué edición se
# partió, pero no es texto de Beccaria y no tiene argumento que estudiar.
# No se puede filtrar por heurística: mide 2.358 caracteres y su título calza
# con el patrón de un capítulo numerado.
omitir = [
  "^Universidad carlos iii",
  "^2015\\. Historia del derecho",
  "^Índice$",
  "^8\\. Nota sobre la presente edición$",
  "^Fin\\.$",
  "^Programa historia del derecho$",
  "^Publicaciones$",
]

# Variantes de la plantilla a activar. Ver prompts/variantes.md
# Opciones: examen, investigacion, tecnico, narrativo, aplicacion-practica
#
# Sin variantes, por el mismo motivo que en el otro libro: `examen` pide 12
# flashcards y 5 preguntas, el mazo y el test se consolidan por libro, y los
# documentos ya escritos van con 8 y 4. Un mazo mezclado se nota.
variantes = []

# Plantilla base a usar en `preparar` (archivo dentro de prompts/)
plantilla = "estudio.md"
